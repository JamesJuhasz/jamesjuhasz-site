name: Daily press scrape

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Scrape press
        run: npm run press:fetch

      - name: Commit changes if any
        run: |
          if [ -n "$(git status --porcelain src/data/press-auto.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/press-auto.json
            git commit -m "press: auto-pulled articles ($(date -u +%F))"
            git push
          else
            echo "No new press entries."
          fi
