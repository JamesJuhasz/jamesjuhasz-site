name: Daily results scrape

on:
  schedule:
    - cron: "30 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Scrape results
        env:
          COACHAIBLE_API_BASE: ${{ secrets.COACHAIBLE_API_BASE }}
          COACHAIBLE_API_TOKEN: ${{ secrets.COACHAIBLE_API_TOKEN }}
        run: npm run results:fetch

      - name: Commit changes if any
        run: |
          if [ -n "$(git status --porcelain src/data/results-auto.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/results-auto.json
            git commit -m "results: auto-scraped ($(date -u +%F))"
            git push
          else
            echo "No new result enrichments."
          fi
